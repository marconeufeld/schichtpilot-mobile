<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="application-name" content="SchichtPilot Mobile">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SchichtPilot">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <title>Betriebsstundenliste · SchichtPilot Mobile</title>
  <link rel="stylesheet" href="css/main.css?v=029">
</head>
<body>
  <main class="app">
    <header class="page-header compact-header">
      <a class="back-button" href="index.html?v=029" aria-label="Zurück zur Startseite">‹</a>
      <div>
        <h2>Betriebsstundenliste</h2>
        <p id="monthLabel">Aktueller Monat</p>
      </div>
    </header>

    <section id="monthSummary" class="month-summary hidden" aria-label="Monatsübersicht">
      <div>
        <span>Schichten</span>
        <strong id="summaryShiftCount">0</strong>
      </div>
      <div>
        <span>Bezahlte Stunden</span>
        <strong id="summaryPaidHours">0 h</strong>
      </div>
    </section>

    <section id="emptyState" class="placeholder-card hidden">
      <div class="placeholder-icon">📝</div>
      <h3>Noch keine Schichten</h3>
      <p>Sobald du eine Schicht speicherst, erscheint sie hier.</p>
      <a class="save-button link-button" href="neue-schicht.html?v=029&mode=new">Neue Schicht</a>
    </section>

    <section id="shiftList" class="shift-list" aria-live="polite"></section>
  </main>

  <div id="deleteDialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
    <div class="dialog-card">
      <div class="dialog-icon">🗑️</div>
      <h3 id="deleteTitle">Schicht wirklich löschen?</h3>
      <p id="deleteText">Diese Aktion kann nicht rückgängig gemacht werden.</p>

      <div class="dialog-actions">
        <button id="cancelDeleteButton" class="dialog-button dialog-cancel" type="button">Abbrechen</button>
        <button id="confirmDeleteButton" class="dialog-button dialog-delete" type="button">Löschen</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js?v=029"></script>
  <script src="js/calculation.js?v=029"></script>
  <script src="js/hours-list.js?v=029"></script>
  <script src="js/pwa.js?v=029"></script>
</body>
</html>
