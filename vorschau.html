<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="application-name" content="SchichtPilot Mobile">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SchichtPilot">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <title>Vorschau · SchichtPilot Mobile</title>
  <link rel="stylesheet" href="css/main.css?v=033">
</head>
<body>
  <main class="app">
    <header class="page-header compact-header">
      <a class="back-button" href="neue-schicht.html?v=033" aria-label="Zurück zur Eingabe">‹</a>
      <div>
        <h2>Vorschau</h2>
        <p>Betriebsstundenliste prüfen</p>
      </div>
    </header>

    <section class="preview-card">
      <div class="preview-date" id="previewDate">–</div>
      <div id="previewStatus" class="preview-status hidden">–</div>

      <div id="previewWorkDetails">
      <div class="summary-box">
        <div><span>Arbeitszeit</span><strong id="previewWorkTime">–</strong></div>
        <div><span>Pause</span><strong id="previewPause">–</strong></div>
      </div>

      <div class="result-row emphasized">
        <span>Bezahlte Stunden</span>
        <strong id="previewPaid">–</strong>
      </div>

      <div class="divider"></div>

      <div class="result-row"><span>21–24 Uhr</span><strong id="preview2124">–</strong></div>
      <div class="result-row"><span>00–04 Uhr</span><strong id="preview0004">–</strong></div>
      <div class="result-row"><span>04–06 Uhr</span><strong id="preview0406">–</strong></div>
      </div>

      <div id="previewAbsenceDetails" class="hidden">
        <div class="result-row emphasized">
          <span>Bezahlte Abwesenheit</span>
          <strong>7,5 h</strong>
        </div>
        <div class="result-row">
          <span>Brutto für diesen Tag</span>
          <strong>123,75 €</strong>
        </div>
        <p class="absence-preview-note">Kein Nachtzuschlag und kein Fahrgeld.</p>
      </div>


      <div id="previewCommentBlock" class="preview-comment hidden">
        <span>Kommentar</span>
        <p id="previewComment"></p>
      </div>

      <p id="previewMessage" class="form-message" role="alert"></p>

      <button id="saveShiftButton" class="save-button" type="button">Schicht speichern</button>
      <a class="text-button" href="neue-schicht.html?v=033">Schicht bearbeiten</a>
    </section>
  </main>

  <script src="js/storage.js?v=033"></script>
  <script src="js/calculation.js?v=033"></script>
  <script src="js/preview.js?v=033"></script>
  <script src="js/pwa.js?v=033"></script>
</body>
</html>
