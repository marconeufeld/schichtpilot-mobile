<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="application-name" content="SchichtPilot Mobile">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SchichtPilot">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <title>Neue Schicht · SchichtPilot Mobile</title>
  <link rel="stylesheet" href="css/main.css?v=044">
</head>
<body>
  <main class="app">
    <header class="page-header compact-header">
      <a class="back-button" href="index.html?v=044" aria-label="Zurück zur Startseite">‹</a>
      <div>
        <h2 id="pageTitle">Neue Schicht</h2>
        <p id="pageSubtitle">Zeiten eingeben</p>
      </div>
    </header>

    <form id="shiftForm" class="form-card" novalidate>
      <label class="field">
        <span>Datum</span>
        <span class="input-shell">
          <span id="shiftDateDisplay" class="input-display">–</span>
          <input id="shiftDate" type="date" required>
        </span>
      </label>

      <fieldset class="status-selector">
        <legend>Eintrag</legend>
        <div class="status-options">
          <label><input type="radio" name="shiftStatus" value="Arbeit" checked><span>Arbeit</span></label>
          <label><input type="radio" name="shiftStatus" value="Urlaub"><span>Urlaub</span></label>
          <label><input type="radio" name="shiftStatus" value="Krank"><span>Krank</span></label>
          <label><input type="radio" name="shiftStatus" value="Feiertag"><span>Feiertag</span></label>
        </div>
      </fieldset>

      <div id="workTimeFields">

      <div class="row">
        <label class="field">
          <span>Beginn</span>
          <span class="input-shell">
            <span id="startTimeDisplay" class="input-display">–</span>
            <input id="startTime" type="time" required>
          </span>
        </label>

        <label class="field">
          <span>Ende</span>
          <span class="input-shell">
            <span id="endTimeDisplay" class="input-display">–</span>
            <input id="endTime" type="time" value="06:00" required>
          </span>
        </label>
      </div>

      <div class="section-label">Unbezahlte Pause</div>

      <div class="row">
        <label class="field">
          <span>Von</span>
          <span class="input-shell">
            <span id="pauseStartDisplay" class="input-display">–</span>
            <input id="pauseStart" type="time" value="00:30" required>
          </span>
        </label>

        <label class="field">
          <span>Bis</span>
          <span class="input-shell">
            <span id="pauseEndDisplay" class="input-display">–</span>
            <input id="pauseEnd" type="time" value="01:00" required>
          </span>
        </label>
      </div>

      </div>

      <div id="absenceNote" class="absence-note hidden">
        <strong id="absenceNoteTitle">Bezahlte Abwesenheit</strong>
        <span>7,5 Stunden · kein Nachtzuschlag · kein Fahrgeld</span>
      </div>


      <label class="field comment-field">
        <span>Kommentar <small>(optional)</small></span>
        <textarea id="shiftComment" maxlength="1000" rows="4"
          placeholder="Zum Beispiel: Urlaubsvertretung, Störung oder Besonderheit"></textarea>
      </label>

      <p id="formMessage" class="form-message" role="alert"></p>
      <button class="save-button" type="submit">Weiter</button>
    </form>
  </main>

  <script src="js/storage.js?v=044"></script>
  <script src="js/new-shift.js?v=044"></script>
  <script src="js/pwa.js?v=044"></script>
</body>
</html>
